<style>
  :root{
    --navy:#02050E; --ivory:#FAF7EE; --gold:#C9A662;
    --sub:rgba(250,247,238,.66); --hair:rgba(250,247,238,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:var(--navy);}
  body{
    color:var(--ivory);
    font-family:'Bodoni Moda',Didot,Georgia,serif;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
    min-height:100dvh;padding:28px 20px;
  }

  /* the badge, on screen */
  .card{
    width:100%;max-width:340px;aspect-ratio:54/85.6;
    display:flex;flex-direction:column;align-items:center;
    padding:9% 8% 7%;
  }

  .mark{width:62%;max-width:210px;line-height:0;}
  .mark svg{width:100%;height:auto;display:block;}

  .tag{
    margin-top:14px;font-size:9.5px;letter-spacing:.42em;
    text-transform:uppercase;color:var(--sub);text-indent:.42em;
  }

  /* the ivory panel, exactly where the code sits on the card */
  .panel{
    margin:auto 0;width:78%;aspect-ratio:1/.46;
    background:var(--ivory);border:1px solid var(--gold);border-radius:14px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-decoration:none;color:var(--navy);gap:6px;
  }
  .panel b{
    font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;font-weight:600;
    text-indent:.26em;
  }
  .panel em{
    font-style:normal;font-size:9px;letter-spacing:.2em;text-transform:uppercase;
    color:rgba(2,5,14,.58);text-indent:.2em;
  }
  .panel:active{opacity:.88;}

  .who{margin-top:26px;text-align:center;}
  .who .n{
    font-family:'Bodoni Moda',Didot,Georgia,serif;
    font-size:21px;line-height:1.2;
  }
  .who .t{
    margin-top:9px;font-size:9px;letter-spacing:.34em;text-transform:uppercase;
    color:var(--sub);text-indent:.34em;
  }

  .lines{margin-top:22px;text-align:center;display:flex;flex-direction:column;gap:9px;}
  .lines a{
    color:var(--ivory);text-decoration:none;
    font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;text-indent:.24em;
  }

  .site{
    margin-top:auto;font-size:9px;letter-spacing:.34em;text-transform:uppercase;
    color:var(--gold);opacity:.85;text-indent:.34em;
  }
  @media (max-height:680px){ .card{aspect-ratio:auto;gap:4px;} .panel{margin:22px 0;} }
</style>
</head>
